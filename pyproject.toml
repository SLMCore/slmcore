[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[project]
name = "slmcore"
version = "0.1.0.dev0"
description = "Reusable SLM control, pattern generation and CGH framework"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "h5py>=3.8",
    "Pillow>=9.5",
    "qtpy>=2.4",
    "PyQt5>=5.15",
    "pyqtgraph>=0.13",
    "matplotlib>=3.7",
    "QDarkStyle>=3.2",
]


[project.optional-dependencies]
test = [
    "pytest>=7",
]


[tool.setuptools.packages.find]
where = ["src"]
include = ["slmcore*"]


[tool.pytest.ini_options]
testpaths = ["tests"]